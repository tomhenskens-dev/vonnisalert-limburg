<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vonnisalert Limburg</title>
<meta name="theme-color" content="#0f2a45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vonnisalert">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="alternate icon" type="image/png" href="/icon-192.png">
<link rel="stylesheet" href="/styles.css?v=3">
<script src="/config.js?v=2"></script>
<script src="/vendor/supabase-2.119.0.js"></script>
</head>
<body>
<header>
  <div class="top">
    <div class="brandwrap"><img src="/logo.svg" alt="" class="logo" width="44" height="44">
      <div><div class="brand">Vonnisalert <span>Limburg</span></div><div class="sub">Rechtbank Limburg · Hasselt &amp; Tongeren<span id="todayLabel"></span></div></div></div>
    <div class="headbtns" id="headBtns" hidden><button class="ghost sm" id="addBtn">＋ Dossier</button></div>
  </div>
  <nav id="nav" hidden>
    <a href="#vandaag" data-view="vandaag">Vandaag</a>
    <a href="#komend" data-view="komend">Komend</a>
    <a href="#week" data-view="week">Week</a>
    <a href="#controle" data-view="controle">Te controleren <span class="badge" id="badgeCheck">0</span></a>
    <a href="#artikels" data-view="artikels">Gerechtsartikels <span class="badge" id="badgeArt">0</span></a>
    <a href="#alle" data-view="alle">Zoeken</a>
    <a href="#archief" data-view="archief">Archief</a>
    <a href="#instellingen" data-view="instellingen">⚙︎</a>
  </nav>
</header>
<main id="app"><p class="muted">Laden…</p></main>
<footer id="footer"></footer>

<dialog id="caseDialog">
  <form id="caseForm" method="dialog">
    <div class="modalhead"><h2 id="dialogTitle">Nieuw dossier</h2><button type="button" class="secondary sm" data-close>Sluiten</button></div>
    <div class="modalbody">
      <div class="tabs" id="modeTabs">
        <button type="button" class="secondary sm on" data-mode="paste">Artikel plakken</button>
        <button type="button" class="secondary sm" data-mode="manual">Zelf invullen</button>
      </div>
      <div id="pasteBox">
        <div class="field full"><label for="pasteUrl">Link naar het HBVL-artikel</label><input id="pasteUrl" type="url" placeholder="https://www.hbvl.be/…"></div>
        <div class="field full" style="margin-top:10px"><label for="pasteText">Tekst van het artikel (plakken)</label><textarea id="pasteText" rows="7" placeholder="Plak hier de titel en tekst van het artikel. De app zoekt zelf de uitspraakdatum, rechtbank en beklaagde."></textarea></div>
        <div class="formgrid" style="margin-top:10px">
          <div class="field"><label for="pastePub">Publicatiedatum</label><input id="pastePub" type="date"></div>
          <div class="field"><label for="pasteAuthor">Auteur</label><input id="pasteAuthor" placeholder="bv. Geert Houben"></div>
        </div>
        <div style="margin-top:12px"><button type="button" class="primary" id="analyzeBtn">Analyseer tekst</button></div>
        <div id="analysisOut"></div>
      </div>
      <div id="formBox" hidden>
        <input type="hidden" id="caseId">
        <div class="formgrid">
          <div class="field full"><label for="f_title">Zaak / omschrijving *</label><input id="f_title" required maxlength="400"></div>
          <div class="field"><label for="f_defendant">Beklaagde (naam of initialen)</label><input id="f_defendant" maxlength="120"></div>
          <div class="field"><label for="f_author">Auteur</label><input id="f_author" maxlength="200"></div>
          <div class="field"><label for="f_author_is_geert">Auteur gecontroleerd</label>
            <select id="f_author_is_geert"><option value="">Nog niet gecontroleerd</option><option value="true">Ja, Geert Houben</option><option value="false">Nee, andere auteur</option></select></div>
          <div class="field"><label for="f_published">Publicatiedatum artikel</label><input id="f_published" type="date"></div>
          <div class="field"><label for="f_hearing">Datum zitting</label><input id="f_hearing" type="date"></div>
          <div class="field"><label for="f_verdict">Verwachte uitspraakdatum</label><input id="f_verdict" type="date"></div>
          <div class="field"><label for="f_court">Rechtbank</label>
            <select id="f_court"><option>Te controleren</option><option>Hasselt</option><option>Tongeren</option></select></div>
          <div class="field"><label for="f_status">Status</label>
            <select id="f_status"><option value="aangekondigd">Aangekondigd</option><option value="morgen">Uitspraak morgen</option><option value="vandaag">Uitspraak vandaag</option><option value="bevestigd">Uitspraak bevestigd</option><option value="uitgesteld">Uitgesteld</option><option value="check">Nog te controleren</option></select></div>
          <div class="field full"><label class="check"><input type="checkbox" id="f_auto"> Status automatisch laten bijwerken (morgen / vandaag / verstreken)</label></div>
          <div class="field full"><label class="check"><input type="checkbox" id="f_reviewed"> Gegevens gecontroleerd (datum, rechtbank, auteur)</label></div>
          <div class="field full"><label for="f_url">Link naar HBVL-artikel</label><input id="f_url" type="url" placeholder="https://www.hbvl.be/…"></div>
          <div class="field full"><label for="f_notes">Notities / bijzonderheden</label><textarea id="f_notes" maxlength="5000"></textarea></div>
        </div>
        <div id="caseExtra"></div>
      </div>
    </div>
    <div class="modalfoot">
      <div><button type="button" class="danger sm" id="deleteBtn" hidden>Verwijderen</button> <a class="btn secondary sm" id="openArticle" target="_blank" rel="noopener" hidden>Open artikel ↗</a></div>
      <div><button type="button" class="secondary" data-close>Annuleren</button> <button type="submit" class="primary" id="saveBtn">Bewaren</button></div>
    </div>
  </form>
</dialog>

<script type="module" src="/app.js?v=3"></script>
<script>
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
</body>
</html>
