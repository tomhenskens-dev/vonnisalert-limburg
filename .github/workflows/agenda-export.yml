name: Agenda exporteren

# Exporteert dagelijks de agenda en de wachtende lijsten naar de branch "agenda-export",
# vlak voor de geplande Claude-taak ze verwerkt. Past ook openstaande updates toe.
on:
  schedule:
    - cron: "17 5 * * *"   # 06:17 (winter) / 07:17 (zomer) Brusselse tijd
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF || secrets.SUPABASE_ACCESS_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Exporteren
        run: |
          REF=$(echo "$REF" | tr -d '[:space:]')
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && { echo "::warning::Geen Supabase-token"; exit 0; }
          REF="$REF" GITHUB_TOKEN="${{ github.token }}" bash .github/scripts/agenda_sync.sh
