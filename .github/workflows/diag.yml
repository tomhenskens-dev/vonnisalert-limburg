name: Diagnose
on:
  push:
    branches: ["diag/run"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF || secrets.SUPABASE_ACCESS_REF }}
      GEERT_EMAIL: ${{ secrets.GEERT_EMAIL }}
      GEERT_PASSWORD: ${{ secrets.GEERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose
        run: |
          set -u
          REF=$(echo "$REF" | tr -d '[:space:]'); E=$(echo "$GEERT_EMAIL" | tr -d '[:space:]')
          U="https://$REF.supabase.co"; mkdir -p out
          KEYS=$(curl -sS "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=true" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          PUB=$(echo "$KEYS" | jq -r '[.[]|select(.type=="publishable")][0].api_key // empty'); ANON=$(echo "$KEYS" | jq -r '[.[]|select(.name=="anon")][0].api_key // empty')
          echo "key types: $(echo "$KEYS" | jq -c '[.[]|{name,type}]')" > out/report.txt
          K=${PUB:-$ANON}
          LOGIN=$(jq -n --arg e "$E" --arg p "$GEERT_PASSWORD" '{email:$e,password:$p}' | curl -sS "$U/auth/v1/token?grant_type=password" -H "apikey: $K" -H "Content-Type: application/json" --data @-)
          TOK=$(echo "$LOGIN" | jq -r '.access_token // empty')
          echo "login ok: $([ -n "$TOK" ] && echo ja || echo "nee $(echo "$LOGIN" | jq -c '{error,error_description,msg}')")" >> out/report.txt
          echo "token alg: $(echo "$TOK" | cut -d. -f1 | base64 -d 2>/dev/null | jq -c . )" >> out/report.txt
          for mode in user pubkey; do
            AUTH=$([ $mode = user ] && echo "$TOK" || echo "$K")
            R=$(curl -sS -w " HTTP%{http_code}" -X POST "$U/functions/v1/vonnisalert" -H "apikey: $K" -H "Authorization: Bearer $AUTH" -H "Content-Type: application/json" -d '{"action":"preview"}' | head -c 300)
            echo "functie ($mode): $R" >> out/report.txt
          done
          echo "getUser met publishable: $(curl -sS -w ' HTTP%{http_code}' "$U/auth/v1/user" -H "apikey: $K" -H "Authorization: Bearer $TOK" | jq -Rr '.[0:80]')" >> out/report.txt
          q() { jq -n --arg q "$1" '{query:$q}' | curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @- ; }
          echo "app_users gelijk aan GEERT_EMAIL: $(q "select count(*) from public.app_users where lower(email)=lower('$E')" )" >> out/report.txt
          echo "aantal app_users: $(q "select count(*) from public.app_users")" >> out/report.txt
          sed -i "s/$REF/<ref>/g; s/$E/<mail>/g" out/report.txt
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout --orphan diag-results; git rm -rfq --cached .; git add out; git commit -qm "diag $(date -u +%T)"; git push -f origin HEAD:diag-results
