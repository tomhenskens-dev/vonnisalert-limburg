name: Diagnose
on:
  push:
    branches: ["diag/run"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF || secrets.SUPABASE_ACCESS_REF }}
      GEERT_EMAIL: ${{ secrets.GEERT_EMAIL }}
      GEERT_PASSWORD: ${{ secrets.GEERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose
        run: |
          set -u
          REF=$(echo "$REF" | tr -d '[:space:]'); E=$(echo "$GEERT_EMAIL" | tr -d '[:space:]')
          U="https://$REF.supabase.co"; mkdir -p out
          K=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' config.js); U=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js)
          TOK=$(jq -n --arg e "$E" --arg p "$GEERT_PASSWORD" '{email:$e,password:$p}' | curl -sS "$U/auth/v1/token?grant_type=password" -H "apikey: $K" -H "Content-Type: application/json" --data @- | jq -r .access_token)
          g() { curl -sS "$U/rest/v1/$1" -H "apikey: $K" -H "Authorization: Bearer $TOK"; }
          g "articles?select=url,title,premium,published_at&author=ilike.*houben*&source=eq.hbvl&order=published_at.desc&limit=12" > out/geert.json
          jq -r '.[].url' out/geert.json > /tmp/urls.txt
          echo "https://www.hbvl.be/regio/limburg/sint-truiden/truienaar-houdt-zwangere-inbreekster-bij-de-enkels-in-bedwang/164471444.html" >> /tmp/urls.txt
          : > out/probe.txt
          while read -r url; do
            code=$(curl -sS -L -A "Mozilla/5.0 (Vonnisalert; toegestaan door HBVL)" -o /tmp/p.html -w "%{http_code}" "$url" || echo ERR)
            sz=$(wc -c < /tmp/p.html 2>/dev/null || echo 0)
            vo=$(grep -oiE ".{0,40}vonnis (op|valt|volgt|wordt)[^<]{0,40}" /tmp/p.html | head -2 | tr '\n' ' ')
            ld=$(grep -c '"articleBody"' /tmp/p.html || true)
            pw=$(grep -oiE 'isAccessibleForFree"?:\s*"?(true|false)|paywall|plus-artikel|premium' /tmp/p.html | sort | uniq -c | tr '\n' ' ' | head -c 160)
            echo "$code | ${sz}B | articleBody:$ld | $pw | $(basename "$url" | cut -c1-50) | VONNIS: $vo" >> out/probe.txt
            sleep 2
          done < /tmp/urls.txt
          head -1 /tmp/urls.txt > /tmp/one.txt; u=$(cat /tmp/one.txt)
          curl -sS -D out/headers.txt -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36" -o /tmp/p2.html "$u"; sed -e 's/<[^>]*>/ /g' /tmp/p2.html | tr -s ' \n' | head -c 700 > out/body403.txt
          curl -sS -o /dev/null -w "rss: %{http_code}\n" https://www.hbvl.be/rss >> out/headers.txt
          curl -sS -o /dev/null -w "amp?: %{http_code}\n" "${u%.html}.amp.html" >> out/headers.txt
          sed -i "s/$REF/<ref>/g; s/$E/<mail>/g" out/*.json
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout --orphan diag-results; git rm -rfq --cached .; git add out; git commit -qm "diag $(date -u +%T)"; git push -f origin HEAD:diag-results
