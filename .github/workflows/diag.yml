name: Diagnose
on:
  push:
    branches: ["diag/run"]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF || secrets.SUPABASE_ACCESS_REF }}
      GEERT_EMAIL: ${{ secrets.GEERT_EMAIL }}
      GEERT_PASSWORD: ${{ secrets.GEERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose
        run: |
          set -u
          REF=$(echo "$REF" | tr -d '[:space:]'); E=$(echo "$GEERT_EMAIL" | tr -d '[:space:]')
          U="https://$REF.supabase.co"; mkdir -p out
          q() { jq -n --arg q "$1" '{query:$q}' | curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @- ; }
          q "select source, author, published_at::date d, first_seen::date f, announcement, premium, left(title,110) t, left(coalesce(lead,''),160) l from public.articles where case_id is null and not dismissed order by published_at desc" > out/arts.json
          q "select key, value from public.app_state where key in ('rss_enabled','only_geert','followed_authors')" > out/state.json
          q "select count(*) filter (where case_id is not null) gekoppeld, count(*) filter (where dismissed) weggeklikt, count(*) totaal from public.articles" > out/tot.json
          sed -i "s/$REF/<ref>/g; s/$E/<mail>/g" out/*.json
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout --orphan diag-results; git rm -rfq --cached .; git add out; git commit -qm "diag $(date -u +%T)"; git push -f origin HEAD:diag-results
