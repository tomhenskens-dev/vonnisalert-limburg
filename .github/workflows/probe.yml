name: probe-hbvl
on:
  push:
    branches: [probe/hbvl]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          mkdir out; cd out
          UA="Mozilla/5.0 (compatible; VonnisalertLimburg/0.1; persoonlijk gebruik)"
          get(){ n=$1; u=$2; echo "== $u" >> index.txt; curl -sSL -A "$UA" -m 30 -o "$n" -w "%{http_code} %{content_type} %{size_download}\n" "$u" >> index.txt 2>&1 || echo fail >> index.txt; }
          get robots.txt https://www.hln.be/robots.txt
          get rss.xml https://www.hln.be/rss.xml
          get home.xml https://www.hln.be/home/rss.xml
          get limburg.xml https://www.hln.be/limburg/rss.xml
          get regio.xml https://www.hln.be/regio/limburg/rss.xml
          get justitie.xml https://www.hln.be/justitie/rss.xml
          get binnenland.xml https://www.hln.be/binnenland/rss.xml
          get hasselt.xml https://www.hln.be/hasselt/rss.xml
          get gn.xml "https://news.google.com/rss/search?q=%22Nienke+Horemans%22&hl=nl&gl=BE&ceid=BE:nl"
          grep -oiE '<link[^>]+(rss|atom)[^>]*>' home.html > home_feeds.txt || true
          grep -oiE 'https://www\.hbvl\.be/[^"]*rss[^"]*' home.html | sort -u >> home_feeds.txt || true
          grep -oiE 'https://www\.hbvl\.be/cnt/[a-z0-9_]+' home.html | sort -u | head -5 > arts.txt || true
          i=0; for a in $(cat arts.txt); do i=$((i+1)); get art$i.html "$a"; done
          for f in art*.html; do [ -f "$f" ] && grep -oE '<script type="application/ld\+json">[^<]{0,4000}' "$f" > "$f.ld.txt"; done
          for f in *.html *.xml; do head -c 300000 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
          ls -la >> index.txt
      - name: Commit
        run: |
          git init -q r && cd r
          git config user.name probe && git config user.email probe@users.noreply.github.com
          cp -r ../out/* .
          git checkout -q -b probe-results && git add . && git commit -qm results
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-results
